apply plugin: 'com.android.application'

android {
    namespace "com.frequencyzen.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.frequencyzen.app" // Must stay the same for updates
        minSdkVersion 23 // Required by Google Play Services Ads (AdMob) - Android 6.0+
        targetSdkVersion 35
        versionCode 3 // Must increment for each update (Play Store requirement)
        versionName "1.1.1" // User-visible version
    }
    // Check if signing configuration is available before defining signingConfigs
    def keystorePropertiesFile = rootProject.file("key.properties")
    def signingConfigAvailable = false
    def keystoreProperties = new Properties()
    
    if (keystorePropertiesFile.exists()) {
        try {
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            def keystorePath = keystoreProperties['storeFile']
            if (keystorePath && keystoreProperties['storePassword'] && 
                keystoreProperties['keyAlias'] && keystoreProperties['keyPassword']) {
                def keystoreFile = file(keystorePath)
                if (keystoreFile.exists()) {
                    signingConfigAvailable = true
                }
            }
        } catch (Exception e) {
            println "WARNING: Could not load key.properties: ${e.message}"
        }
    }
    
    signingConfigs {
        // IMPORTANT: For app updates to work, ALL release APKs must use the SAME signing key
        // Users will get "installation conflict" errors if signing keys differ between versions
        // Always use the same keystore file (freq.jks) for all release builds
        // See ANDROID_UPDATE_GUIDE.md for more details
        release {
            if (signingConfigAvailable) {
                def keystorePath = keystoreProperties['storeFile']
                def keystoreFile = file(keystorePath)
                storeFile keystoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            testCoverageEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only use signing config if key.properties exists and is valid
            if (signingConfigAvailable && signingConfigs.hasProperty('release')) {
                signingConfig signingConfigs.release
            } else {
                // Build unsigned if key.properties not configured (not for production!)
                println "WARNING: key.properties not found. Release build will be unsigned."
                println "WARNING: Create key.properties for production signing. See QUICK_SIGNING_FIX.md"
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Google Analytics (Firebase) - Uncomment after adding google-services.json
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-analytics'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied")
}

